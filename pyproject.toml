[project]
name = "glab-dash"
version = "0.1.0"
description = "A GitLab merge request dashboard TUI"
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "python-gitlab>=8.5.0",
    "textual>=8.2.8",
    "structlog>=24.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "archunitpython>=1.5.0",
    "ruff>=0.8",
    "pytest-textual-snapshot>=1.0.0",
    "pytest-asyncio>=1.4.0",
    "ty>=0.0.76",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glab_dash"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [".scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN001", "ANN201", "ANN204", "ANN205", "ANN206"]

[tool.ty.src]
exclude = [".scratch"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[project.scripts]
glab-dash = "glab_dash.infrastructure.tui.app:run"
